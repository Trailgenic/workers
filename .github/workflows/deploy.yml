name: Verify and Deploy Workers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:json
      - run: npm test
      - run: npm run test:permit-poller
      - run: npm run test:workers
      - run: npm run validate:registry
      - run: npm run wrangler:dry-run
      - run: npm run wrangler:dry-run:permit-poller
      - run: npm run test:sleepgenic-mcp
      - run: npm run wrangler:dry-run:sleepgenic-mcp
      - run: git diff --check

  deploy-tool-registry:
    name: Deploy tool-registry Worker
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy tool-registry only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config tool-registry/wrangler.jsonc
      - name: Allow Cloudflare deployment propagation
        run: sleep 25
      - name: Run live acceptance harness
        run: node scripts/live-acceptance.mjs

  deploy-permit-poller:
    name: Provision and deploy permit poller
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision resources, migrate D1, and deploy
        run: npm run deploy:permit-poller


  deploy-sleepgenic-mcp:
    name: Deploy Sleepgenic MCP Worker
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve the Cloudflare account that owns sleepgenic.ai
        id: sleepgenic-zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SLEEPGENIC_CLOUDFLARE_API_TOKEN }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=sleepgenic.ai&status=active&per_page=1")"
          account_id="$(jq -r 'if .success then .result[0].account.id // empty else empty end' <<<"${response}")"
          if [[ -z "${account_id}" ]]; then
            echo "::error::The configured Cloudflare token cannot resolve the active sleepgenic.ai zone."
            jq -r '.errors[]?.message' <<<"${response}"
            exit 1
          fi
          echo "account_id=${account_id}" >> "${GITHUB_OUTPUT}"
      - name: Deploy Sleepgenic MCP and provision custom domain
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.SLEEPGENIC_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.sleepgenic-zone.outputs.account_id }}
          wranglerVersion: '4'
          command: deploy --config workers/sleepgenic-mcp/wrangler.jsonc
      - name: Allow DNS and certificate propagation
        run: sleep 25
      - name: Run Sleepgenic live acceptance harness
        run: npm run test:sleepgenic-mcp:live
