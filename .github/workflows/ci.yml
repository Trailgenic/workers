name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:json
      - run: npm test
      - run: npm run test:workers
      - run: npm run validate:registry
      - run: npm run wrangler:dry-run
      - run: git diff --check
